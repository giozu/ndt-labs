# --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. ---
# Z3ST teaching case: the lined, gamma-heated wall of G4, THERMO-MECHANICAL, BEHIND THE SHIELD
#
# The case G4_lined_wall_thermal with the mechanics switched on: the same geometry, materials
# and thermal conditions, plus internal pressure, the closed-end axial load and an axial
# restraint. Exactly the step a group takes in G5 with its own G4 case.
# The shield is not meshed: as in G04 section 8, it enters only through the attenuated source
# (material cards) and the convection of the shield-liner channel on the wetted surface.
# --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. --- --.. ..- .-.. .-.. ---

mesh_path: mesh.msh
geometry_path: geometry.yaml
boundary_conditions_path: boundary_conditions.yaml

materials:
  liner: liner_neutral.yaml
  steel: steel_neutral.yaml

regime: axisymmetric

solver_settings:
  coupling: staggered
  max_iters: 100
  relax_T: 1.0
  relax_u: 1.0
  relax_adaptive: false

models:
  thermal: true
  mechanical: true

mechanical:
  solver: linear
  order: 2
  linear_solver: direct_mumps
  rtol: 1.0e-10
  stag_tol: 1.0e-8
  convergence: rel_norm

thermal:
  solver: linear
  linear_solver: direct_mumps
  rtol: 1.0e-10
  stag_tol: 1.0e-10
  convergence: rel_norm

lhr:
- 0.0
time:
- 0.0
n_steps: 1
