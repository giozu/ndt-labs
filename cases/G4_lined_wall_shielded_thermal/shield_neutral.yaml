name: shield_neutral

# The thermal shield: the same neutral steel as the vessel (steel_neutral.yaml). It receives
# the full gamma source, referred to its own inner face. 
# Mechanical data unused while mechanical: false.

E: 1.90e+11           # Young's modulus (Pa)
nu: 0.30              # Poisson's ratio (-)
k: 20.0               # Thermal conductivity (W/m·K)
cp: 500.0             # Specific heat capacity (J/kg·K)
alpha: 1.6e-5         # Thermal expansion coefficient (1/K)
rho: 7900.0           # Density (kg/m³)
T_ref: 560.0          # Reference (stress-free) temperature (K)
mu_gamma: 27.0        # Gamma linear attenuation coefficient (1/m)
gamma_heating: 2.6e+6 # Volumetric gamma heating at the shield inner face (W/m³): the q0 of G4
gamma_inner_radius: 0.260  # where gamma_heating is referred: the shield inner face (m)
