thermal:
  shield:
  # - shield inner face: forced convection, barrel-shield channel,
  #       -k dT/dr = -h_in (T - T_cool)
  - type: Robin
    region: shield_inner
    h_conv: 39302.0       # W/(m2 K), heat transfer coefficient h_in
    T_ext: 560.0          # K, coolant

  # - shield outer face: forced convection, shield-liner channel,
  #       -k dT/dr =  h_out (T - T_cool)
  - type: Robin
    region: shield_outer
    h_conv: 38370.0       # W/(m2 K), heat transfer coefficient h_out
    T_ext: 560.0          # K, coolant

  liner:
  # - wetted surface (inner face of the liner): forced convection, the same shield-liner channel,
  #       -k dT/dr = -h_out (T - T_cool)     with the shield in, h_out replaces h1
  - type: Robin
    region: wetted_surface
    h_conv: 38370.0       # W/(m2 K), heat transfer coefficient h_out
    T_ext: 560.0          # K, coolant

  steel:
  # - vessel outer surface: insulation + natural convection in series,
  #       -k dT/dr =  U2 (T - T_inf)         U2, global heat transfer coefficient, referred to r = Ro, outer radius of the vessel
  - type: Robin
    region: outer_radius
    h_conv: 1.271         # W/(m2 K), heat transfer coefficient U2
    T_ext: 320.0          # K, containment water

  # Top and bottom are left adiabatic (the default): the temperature field is radial.
  # The coolant is not meshed and is at one temperature: shield and vessel exchange no heat.
