# Temperature field of the shielded, lined wall. The coolant is not meshed: it flows in two
# channels, barrel-shield and shield-liner, and enters as convection on every wetted face,
#        -k dT/dn = h (T - T_cool)
#
#  - shield inner face:    h_in,  the barrel-shield channel   (G3, section 5)
#  - shield outer face:    h_out, the shield-liner channel    (G3, section 5)
#  - wetted surface:       h_out, the same channel, on its other wall
#  - vessel outer surface: U2, insulation + natural convection, referred to r = Ro (G3)
#
# Top and bottom are left adiabatic (the default): the field is radial.
# The coolant is at ONE temperature everywhere: the shield and the vessel exchange no heat
# with each other. What couples them is the gamma source only (the material cards).

thermal:
  shield:
  - type: Robin
    region: shield_inner
    h_conv: 39302.0       # W/(m2 K), h_in, neutral, G3 section 5
    T_ext: 560.0          # K, coolant
  - type: Robin
    region: shield_outer
    h_conv: 38370.0       # W/(m2 K), h_out, neutral, G3 section 5
    T_ext: 560.0          # K, coolant

  liner:
  - type: Robin
    region: wetted_surface
    h_conv: 38370.0       # W/(m2 K), h_out: with the shield in, it replaces h1 here
    T_ext: 560.0          # K, coolant

  steel:
  - type: Robin
    region: outer_radius
    h_conv: 1.271         # W/(m2 K), U2, neutral, as in G3/G4
    T_ext: 320.0          # K, containment water
