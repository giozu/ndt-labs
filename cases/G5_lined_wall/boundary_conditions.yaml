thermal:
  liner:
  # - wetted surface (inner face of the liner): forced convection to the coolant,
  #       -k dT/dr = -h1 (T - T_cool)        h1, heat transfer coefficient from Dittus-Boelter
  - type: Robin
    region: inner_radius
    h_conv: 23858.0       # W/(m2 K), heat transfer coefficient h1
    T_ext: 560.0          # K, coolant

  steel:
  # - vessel outer surface: insulation + natural convection in series,
  #       -k dT/dr =  U2 (T - T_inf)         U2, global heat transfer coefficient, referred to r = Ro, outer radius of the vessel
  - type: Robin
    region: outer_radius
    h_conv: 1.271         # W/(m2 K), heat transfer coefficient U2
    T_ext: 320.0          # K, containment water

  # Top and bottom are left adiabatic (the default): the temperature field is radial.


mechanical:
  steel:
  - type: Neumann         # closed-end axial stress on the top face, P Rw^2/(Ro^2 - Rw^2), applied on the whole top, Rw..Ro
    region: top
    traction: 1.815650e+07  # Pa

  - type: Clamp_y         # remove the axial rigid-body motion
    region: bottom

  liner:
  - type: Neumann         # internal pressure P = 15 MPa on the wetted surface (t = -P n)
    region: inner_radius  # the label 'inner_radius' refers to the wetted radius of the liner
    traction: -1.5e+7     # Pa
