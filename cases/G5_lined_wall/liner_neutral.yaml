name: liner_neutral

# Generic austenitic liner:
# - k lower than the ferritic vessel steel
# - same attenuation coefficient (at these photon energies, 2 MeV, the attenuation per unit mass follows the electrons per gram, nearly equal for the two steels)

E: 1.95e+11           # Young's modulus (Pa)
nu: 0.30              # Poisson's ratio (-)
k: 16.0               # Thermal conductivity (W/m·K)
cp: 500.0             # Specific heat capacity (J/kg·K)
alpha: 1.7e-5         # Thermal expansion coefficient (1/K)
rho: 7900.0           # Density (kg/m³)
T_ref: 560.0          # Reference (stress-free) temperature (K)

# gamma heating (cyl) follows q''' = q'''0 * K0(mu r) / K0(mu R_ref)
# R_ref = gamma_inner_radius, here below
# if gamma_inner_radius is empty, it is taken from geometry.yaml as inner_radius

mu_gamma: 27.0        # Gamma linear attenuation coefficient (1/m)
gamma_heating: 2.6e+6 # W/m3 at the wetted surface
                      # >>> CHANGE HERE with your gamma_heating q'''0
# gamma_inner_radius: 0.296 # wetted surface, inner face of the liner, where the attenuation starts (m), optional, equal to inner_radius
