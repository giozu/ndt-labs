name: lined_gamma_heated_cylinder
geometry_type: cyl

inner_radius: 0.296      # wetted surface, inner face of the liner (m)
                         # z3st reads this key 'inner_radius', and normalises the gamma source here, for both materials: liner and vessel (steel)
                         # if mu is the same for liner and vessel like in our case (liner_neutral.yaml, steel_neutral.yaml), and the materials are adjacent,
                         # the profile q'''(r) = q'''0 K0(mu r) / K0(mu R_ref) can be written with the same inner_radius and the same
                         # q'''0 referred to the inner_radius, for the two materials. The attenuation will follow automatically.
                         # alternatively, one can define gamma_inner_radius in each material.yaml card, and normalise the source with respect to that radius

interface_radius: 0.300  # vessel inner surface, liner-vessel interface (m)
outer_radius: 0.400      # vessel outer surface (m)

Lz: 2.000 # height (m)

labels:
  inner_radius: 1
  outer_radius: 2
  bottom: 3
  top: 4
  liner: 10
  steel: 11
