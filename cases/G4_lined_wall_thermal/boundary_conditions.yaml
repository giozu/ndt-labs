# Temperature field of the lined wall: the boundary conditions of the assignment.
#
#  - wetted surface (inner face of the liner): forced convection to the coolant,
#        -k dT/dr = -h1 (T - T_cool)        h1 from Dittus-Boelter (G3)
#  - vessel outer surface: insulation + natural convection in series,
#        -k dT/dr =  U2 (T - T_inf)         U2 from G3, referred to r = Ro
#
# The steel is NOT in U2: it carries the gamma source and is the domain solved here.
# Top and bottom are left adiabatic (the default): the field is radial.

thermal:
  liner:
  - type: Robin
    region: inner_radius
    h_conv: 23858.0       # W/(m2 K) -- h1, neutral, as in G3/G4
    T_ext: 560.0          # K -- coolant

  steel:
  - type: Robin
    region: outer_radius
    h_conv: 1.271         # W/(m2 K) -- U2, neutral, as in G3/G4
    T_ext: 320.0          # K -- containment water
